<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود به سامانه نمایندگان | ATA Battery</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/common.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
font-family: 'Vazirmatn', sans-serif;
background: linear-gradient(135deg, var(--navy-dark) 0%, var(--petroleum-dark) 100%);
min-height: 100vh;
padding-top: 82px;
}
/* ============================================
صفحه‌ی ورود نمایندگان (بدون کف شطرنجی)
============================================ */
.login-page {
position: relative;
min-height: calc(100vh - 82px);
display: flex;
align-items: center;
justify-content: center;
overflow: hidden;
padding: 20px 20px;
}
.login-page::before {
content: '';
position: absolute; top: 0; left: 0; width: 100%; height: 100%;
background: radial-gradient(circle at 50% 15%, rgba(201,162,39,0.12) 0%, transparent 55%);
z-index: 0;
}
.login-card {
position: relative; z-index: 1;
width: 100%; max-width: 440px;
background: rgba(255,255,255,0.97);
border: 2px solid var(--gold-primary);
border-top: 4px solid var(--gold-primary);
border-radius: 16px;
box-shadow: 0 25px 60px rgba(0,0,0,0.35);
padding: 30px 30px;
text-align: center;
}
.login-logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 26px; }
.login-logo .logo-icon { width: 56px; height: 56px; }
.login-logo h2 {
display: flex; align-items: baseline; gap: 6px;
color: var(--navy-dark); font-size: 13px; font-weight: 900; letter-spacing: 1px;
}
.login-logo h2 span { color: var(--gold-primary); font-size: 24px; font-weight: 700; letter-spacing: 3px; }
.login-card h1 {
color: var(--navy-dark);
font-size: 21px;
font-weight: 900;
margin-bottom: 10px;
}
.login-subtitle {
color: #666;
font-size: 13.5px;
margin-bottom: 30px;
line-height: 1.9;
}
.login-field { text-align: right; margin-bottom: 18px; }
.login-field label {
display: block; color: var(--navy-dark); font-weight: 700; font-size: 13.5px; margin-bottom: 8px;
}
.login-field input {
width: 100%;
padding: 13px 16px;
background: var(--white);
border: 1.5px solid #ddd;
border-radius: 10px;
color: var(--navy-dark);
font-family: 'Vazirmatn', sans-serif;
font-size: 14px;
outline: none;
transition: var(--transition);
text-align: right;
}
.login-field input:focus {
border-color: var(--gold-primary);
box-shadow: 0 0 0 4px rgba(201,162,39,0.12);
}
.login-submit {
width: 100%;
background: linear-gradient(135deg, var(--gold-primary), var(--gold-light));
color: var(--navy-dark);
border: none;
padding: 15px;
border-radius: 50px;
font-family: 'Vazirmatn', sans-serif;
font-weight: 800;
font-size: 16px;
cursor: pointer;
transition: var(--transition);
box-shadow: 0 10px 25px rgba(201,162,39,0.35);
margin-top: 6px;
}
.login-submit:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(201,162,39,0.5); }
.login-help {
color: #888;
font-size: 12.5px;
margin-top: 22px;
line-height: 1.9;
}
.login-register-link {
color: var(--navy-dark);
font-weight: 700;
font-size: 13.5px;
margin-top: 14px;
}
.login-register-link a { color: var(--gold-primary); text-decoration: none; }
.login-register-link a:hover { text-decoration: underline; }
@media (max-width: 768px) {
.login-card { padding: 32px 22px; }
body { padding-top: 64px; }
.login-page { min-height: calc(100vh - 64px); }
}
/* ============================================
   قوانین عمومی ری‌اسپانسیو موبایل
   (این بلوک رو آخر <style> هر صفحه بچسبونید)
   ============================================ */

html, body {
    overflow-x: hidden;
}

img {
    max-width: 100%;
    height: auto;
}

/* هر گریدی که اسمش شامل "-grid" باشه، خودکار تک‌ستونه می‌شه */
@media (max-width: 768px) {
    [class*="-grid"] {
        grid-template-columns: 1fr !important;
    }

    /* هر بخشی که اسمش شامل "-selector" یا "-container" باشه، عمودی و جمع‌وجورتر می‌شه */
    [class*="-selector"] {
        flex-wrap: wrap !important;
        gap: 8px !important;
        border-radius: 20px !important;
    }

    [class*="-container"] {
        padding-left: 20px !important;
        padding-right: 20px !important;
    }

    h1 { font-size: clamp(24px, 6vw, 32px) !important; }
    h2 { font-size: clamp(20px, 5vw, 26px) !important; }

    /* هر بخشی که به‌صورت گرید ۲ ستونه یا بیشتر تعریف شده (مثل featured-post) */
    [class*="-post"], [class*="-hero"], [class*="-content"] {
        word-break: break-word;
    }
}

@media (max-width: 480px) {
    body { font-size: 14px; }
    .filter-container, [class*="-form"] {
        flex-direction: column !important;
    }
}
</style>
</head>
<body>
<div id="navbar-placeholder"></div>

<section class="login-page">
<div class="login-card">
<div class="login-logo">
<div class="logo-icon">
<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
<polygon points="200,20 245.5,31.2 274.7,70.6 323.4,76.2 355.9,110 368.9,155 349.4,200 368.9,245 355.9,290 323.4,323.8 274.7,329.4 245.5,368.8 200,380 154.5,368.8 125.3,329.4 76.6,323.8 44.1,290 31.1,245 50.6,200 31.1,155 44.1,110 76.6,76.2 125.3,70.6 154.5,31.2" fill="#0A1F3D" stroke="#C9A227" stroke-width="5" stroke-linejoin="miter"/>
<polygon points="200,55 322,125 322,275 200,345 78,275 78,125" fill="none" stroke="#C9A227" stroke-width="1.5" opacity="0.8"/>
<polygon points="209,110 119,218 200,218 191,290 281,182 200,182" fill="#D4AF37" stroke="#0A1F3D" stroke-width="2.5" stroke-linejoin="miter"/>
<polygon points="205,150 155,210 200,210 195,249.5 244.5,190 200,190" fill="#06283D"/>
</svg>
</div>
<h2>باتری<span>آتا</span></h2>
</div>

<h1>ورود به پرتال نمایندگان آتا باتری</h1>
<p class="login-subtitle">برای استفاده از خدمات پس از فروش، لطفاً اطلاعات کاربری خود را وارد کنید.</p>

<form onsubmit="event.preventDefault(); alert('فرم ورود هنوز به سرور وصل نشده است.');">
<div class="login-field">
<label for="username">نام کاربری</label>
<input type="text" id="username" name="username" required>
</div>
<div class="login-field">
<label for="password">رمز عبور</label>
<input type="password" id="password" name="password" required>
</div>
<button type="submit" class="login-submit">ورود به سامانه</button>
</form>

<p class="login-help">در صورت فراموشی رمز عبور با واحد پشتیبانی تماس بگیرید.</p>
<p class="login-register-link">نماینده جدید هستید؟ <a href="/pages/register.html">ثبت‌نام کنید</a></p>
</div>
</section>

<div id="footer-placeholder"></div>

<script src="../assets/js/include.js"></script>
</body>
</html>
