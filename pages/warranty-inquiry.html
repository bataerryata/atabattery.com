<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعلام گارانتی |  آتا باتری</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="../assets/css/warranty-inquiry.css">
</head>
<body>

    <div id="navbar-placeholder"></div>

    <div class="page-content">
        <div class="inquiry-container">
            <div class="page-header">
                <h1>استعلام <span>آنلاین</span> گارانتی</h1>
                <p>بررسی اعتبار و وضعیت گارانتی محصولات آتا</p>
            </div>

            <div class="inquiry-card">
                <h3><i class="fas fa-search"></i> فرم استعلام گارانتی</h3>
                <p>برای بررسی وضعیت گارانتی محصول خود، کد ۱۶ رقمی درج شده روی باتری را وارد نمایید.</p>

                <form onsubmit="event.preventDefault(); alert('استعلام با موفقیت انجام شد. باتری شما دارای ۱۲ ماه گارانتی معتبر است.');">
                    <div class="form-group">
                        <label>کد ۱۶ رقمی باتری (Warranty Code)</label>
                        <input type="text" placeholder="مثال: AT-1402-XXXX-XXXX" required maxlength="20" style="direction: ltr; text-align: left;">
                    </div>
                    <div class="form-group">
                        <label>شماره موبایل</label>
                        <input type="tel" placeholder="0912XXXXXXX" required style="direction: ltr; text-align: left;">
                    </div>
                    <button type="submit" class="btn-submit">
                        <i class="fas fa-search"></i>
                        بررسی وضعیت گارانتی
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="../assets/js/include.js"></script>
    <script>
        function highlightActiveNav() {
            const currentPath = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('.nav-menu > .nav-item > a.nav-link').forEach(link => {
                link.classList.remove('active');
                const linkPath = link.getAttribute('href').split('/').pop().split('?')[0];
                if (linkPath === currentPath) link.classList.add('active');
            });
            document.querySelectorAll('.nav-menu > .nav-item > span.nav-link').forEach(span => {
                span.classList.remove('active');
                const dropdown = span.nextElementSibling;
                if (dropdown) {
                    dropdown.querySelectorAll('a').forEach(a => {
                        const linkPath = a.getAttribute('href').split('/').pop().split('?')[0];
                        if (linkPath && linkPath === currentPath) span.classList.add('active');
                    });
                }
            });
        }
        document.addEventListener('partLoaded', function (e) {
            if (e.detail.id === 'navbar-placeholder') highlightActiveNav();
        });
    </script>
</body>
</html>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Vazirmatn', sans-serif; background: var(--white); color: var(--navy-dark); line-height: 1.8; }

.inquiry-container { max-width: 600px; margin: 0 auto; padding: 0 20px; }
.page-content { margin-top: 82px; padding: 50px 0; min-height: 80vh; }
.page-header { text-align: center; margin-bottom: 40px; }
.page-header h1 { font-size: 36px; font-weight: 900; color: var(--navy-dark); margin-bottom: 12px; }
.page-header h1 span { color: var(--gold-primary); }
.page-header p { color: #666; font-size: 16px; }

.inquiry-card { background: linear-gradient(135deg, var(--navy-dark), var(--petroleum-dark)); border-radius: 16px; padding: 35px; color: var(--white); box-shadow: 0 12px 30px rgba(10,31,61,0.25); }
.inquiry-card h3 { font-size: 22px; margin-bottom: 8px; color: var(--gold-primary); display: flex; align-items: center; gap: 10px; }
.inquiry-card > p { opacity: 0.9; margin-bottom: 25px; font-size: 14px; }

.form-group { margin-bottom: 20px; }
.form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
.form-group input { width: 100%; padding: 14px; border: 1.5px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); border-radius: 8px; color: var(--white); font-family: 'Vazirmatn', sans-serif; font-size: 15px; transition: var(--transition); }
.form-group input::placeholder { color: rgba(255,255,255,0.5); }
.form-group input:focus { outline: none; border-color: var(--gold-primary); background: rgba(255,255,255,0.15); }

.btn-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--gold-primary), var(--gold-light)); color: var(--navy-dark); border: none; border-radius: 8px; font-weight: 800; font-size: 16px; cursor: pointer; transition: var(--transition); font-family: 'Vazirmatn', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(201,162,39,0.35); }

@media (max-width: 768px) {
    .page-content { margin-top: 64px; }
    .page-header h1 { font-size: 28px; }
    .inquiry-card { padding: 25px; }
}
/* ============================================
   قوانین عمومی ری‌اسپانسیو موبایل
   (این بلوک رو آخر <style> هر صفحه بچسبونید)
   ============================================ */

html, body {
    overflow-x: hidden;
}

img {
    max-width: 100%;
    height: auto;
}

/* هر گریدی که اسمش شامل "-grid" باشه، خودکار تک‌ستونه می‌شه */
@media (max-width: 768px) {
    [class*="-grid"] {
        grid-template-columns: 1fr !important;
    }

    /* هر بخشی که اسمش شامل "-selector" یا "-container" باشه، عمودی و جمع‌وجورتر می‌شه */
    [class*="-selector"] {
        flex-wrap: wrap !important;
        gap: 8px !important;
        border-radius: 20px !important;
    }

    [class*="-container"] {
        padding-left: 20px !important;
        padding-right: 20px !important;
    }

    h1 { font-size: clamp(24px, 6vw, 32px) !important; }
    h2 { font-size: clamp(20px, 5vw, 26px) !important; }

    /* هر بخشی که به‌صورت گرید ۲ ستونه یا بیشتر تعریف شده (مثل featured-post) */
    [class*="-post"], [class*="-hero"], [class*="-content"] {
        word-break: break-word;
    }
}

@media (max-width: 480px) {
    body { font-size: 14px; }
    .filter-container, [class*="-form"] {
        flex-direction: column !important;
    }
}
</style>
