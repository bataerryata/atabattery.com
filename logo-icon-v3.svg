  <polygon points="200,20 245.5,31.2 274.7,70.6 323.4,76.2 355.9,110 368.9,155 349.4,200 368.9,245 355.9,290 323.4,323.8 274.7,329.4 245.5,368.8 200,380 154.5,368.8 125.3,329.4 76.6,323.8 44.1,290 31.1,245 50.6,200 31.1,155 44.1,110 76.6,76.2 125.3,70.6 154.5,31.2"
